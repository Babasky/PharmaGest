# Configuration DDEV de PharmaGest — https://ddev.readthedocs.io
name: pharmagest
type: symfony
docroot: public
php_version: "8.3"
webserver_type: nginx-fpm
xdebug_enabled: false
timezone: Africa/Bamako
composer_version: "2"
database:
    type: mysql
    version: "8.0"
web_environment:
    - APP_ENV=dev
    - DATABASE_URL=mysql://db:db@db:3306/db?serverVersion=8.0.32&charset=utf8mb4
    - MAILER_DSN=smtp://localhost:1025
    - DEFAULT_URI=https://pharmagest.ddev.site
# Mailpit est fourni par DDEV : https://pharmagest.ddev.site:8026 (ou `ddev launch -m`).
# Envoi asynchrone des emails (Messenger) : worker lancé en tâche de fond.
web_extra_daemons:
    - name: messenger
      command: "sleep 5 && php bin/console messenger:consume async --time-limit=3600 -vv"
      directory: /var/www/html
hooks:
    post-start:
        - exec: composer install --no-interaction
        - exec: php bin/console importmap:install
        - exec: php bin/console doctrine:migrations:migrate --no-interaction --allow-no-migration
