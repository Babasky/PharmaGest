# PharmaGest — hôte virtuel Nginx (production). À copier dans /etc/nginx/sites-available/pharmagest
# puis à activer ; le certificat est obtenu avec certbot (voir docs/mise-en-production.md).

server {
    listen 80;
    listen [::]:80;
    server_name app.pharmagest.ml;
    # Tout passe en HTTPS (§ 6 Sécurité).
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.pharmagest.ml;

    ssl_certificate     /etc/letsencrypt/live/app.pharmagest.ml/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.pharmagest.ml/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Seul le dossier public est servi ; les fichiers des pharmacies (var/fichiers) ne le sont jamais directement.
    root /var/www/pharmagest/current/public;

    # Justificatifs, ordonnances et imports : 10 Mo au plus par requête.
    client_max_body_size 10m;

    # Connexion 3G : compression des pages et des ressources.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Ressources versionnées par AssetMapper : mise en cache longue.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_read_timeout 120s;
        internal;
    }

    # Aucun autre script PHP n'est exécutable.
    location ~ \.php$ {
        return 404;
    }

    access_log /var/log/nginx/pharmagest_access.log;
    error_log  /var/log/nginx/pharmagest_error.log;
}
