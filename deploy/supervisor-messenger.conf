; PharmaGest — worker Messenger supervisé (emails asynchrones et tâches planifiées : rappels d'échéance,
; notifications du matin, archivage automatique). À copier dans /etc/supervisor/conf.d/pharmagest.conf.
; Le worker s'arrête de lui-même toutes les heures (ou au-delà de 256 Mo) et Supervisor le relance :
; cela évite les fuites de mémoire et prend en compte un nouveau déploiement.

[program:pharmagest-messenger]
command=php /var/www/pharmagest/current/bin/console messenger:consume async scheduler_default --time-limit=3600 --memory-limit=256M --env=prod
user=www-data
numprocs=1
startsecs=0
autostart=true
autorestart=true
startretries=10
stopwaitsecs=30
stdout_logfile=/var/log/pharmagest/messenger.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
redirect_stderr=true
