name: CI

on:
  push:
  pull_request:

jobs:
  qualite:
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: pharmagest_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/pharmagest?serverVersion=8.0.32&charset=utf8mb4
      TZ: Africa/Bamako
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: intl, pdo_mysql, zip, gd, mbstring, xml
          coverage: none
          ini-values: date.timezone=Africa/Bamako

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ hashFiles('composer.lock') }}

      - run: composer install --no-interaction --no-progress --prefer-dist

      - name: Assets (importmap)
        run: php bin/console importmap:install

      - name: Style (PHP-CS-Fixer)
        run: vendor/bin/php-cs-fixer fix --dry-run --diff

      - name: Analyse statique (PHPStan)
        run: |
          php bin/console cache:warmup --env=dev
          vendor/bin/phpstan analyse --memory-limit=1G --no-progress

      - name: Base de test
        run: php bin/console doctrine:migrations:migrate --no-interaction --env=test

      - name: Schéma Doctrine
        run: php bin/console doctrine:schema:validate --env=test

      - name: Tests (PHPUnit)
        run: php bin/phpunit
