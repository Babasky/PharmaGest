framework:
    rate_limiter:
        # Demandes de lien « mot de passe oublié » : 3 par quart d'heure et par adresse IP + email.
        mot_de_passe_oublie:
            policy: sliding_window
            limit: 3
            interval: '15 minutes'

        # Code PIN (changement de vendeur, autorisations du propriétaire) : 5 erreurs par quart d'heure.
        code_pin:
            policy: sliding_window
            limit: 5
            interval: '15 minutes'
